    <style>
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* FORCE THE MAP TO FILL THE SCREEN AND SHOW A GRAY BACKGROUND IF TILES FAIL */
        .leaflet-container {
            width: 100vw !important;
            height: 100vh !important;
            background-color: #ddd !important;
        }
    </style>
</head>
