<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb">
    <title>AccessVision - Ghidare Asistivă și Navigație pentru Nevăzători</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Identity Services (Google Sign-In) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/ro_RO/sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .leaflet-container {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            background-color: #f3f4f6 !important;
        }

        /* Modern Leaflet popup styles */
        .leaflet-popup-content-wrapper {
            border-radius: 14px !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15) !important;
            padding: 6px !important;
        }

        .leaflet-popup-tip {
            box-shadow: 0 10px 25px rgba(0,0,0,0.15) !important;
        }

        /* High-contrast focus outline for accessibility */
        button:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 3px solid #2563eb !important;
            outline-offset: 2px !important;
        }

        /* Pulsing & radar animations for real-time client marker */
        @keyframes userLocationPulse {
            0% {
                transform: scale(0.85);
                opacity: 0.9;
            }
            70% {
                transform: scale(2.4);
                opacity: 0;
            }
            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }

        @keyframes radarSweep {
            0% {
                opacity: 0.55;
            }
            50% {
                opacity: 0.85;
            }
            100% {
                opacity: 0.55;
            }
        }

        .user-marker-container {
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .realtime-puck-container {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .realtime-pulse-ring {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.35);
            animation: userLocationPulse 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
            pointer-events: none;
        }

        .realtime-radar-cone {
            position: absolute;
            top: -16px;
            left: 2px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.45) 0%, rgba(59, 130, 246, 0.12) 65%, transparent 80%);
            clip-path: polygon(50% 100%, 15% 0%, 85% 0%);
            transform-origin: 50% 100%;
            pointer-events: none;
            animation: radarSweep 2s ease-in-out infinite;
        }

        .realtime-puck-core {
            position: relative;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: 2.5px solid #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5), 0 2px 6px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #ffffff;
            z-index: 2;
        }

        .realtime-heading-arrow {
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 5.5px solid transparent;
            border-right: 5.5px solid transparent;
            border-bottom: 9px solid #1d4ed8;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
            z-index: 3;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
