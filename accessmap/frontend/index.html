<!doctype html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1D4ED8">
    <meta name="description" content="Navigație pietonală accesibilă cu comenzi vocale și detecție de obstacole prin cameră.">

    <!-- PWA: installable app (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <!-- iPhone / iPad home-screen app -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AccessVision">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>AccessVision - Ghidare Asistivă și Navigație pentru Nevăzători</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Identity Services (Google Sign-In) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>


    <style>
        /* Palette: mirrors src/theme.js (the only colors the app uses) */
        :root {
            --am-primary: #1D4ED8;
            --am-primary-hover: #1E40AF;
            --am-primary-soft: #EFF6FF;
            --am-ink: #0F172A;
            --am-ink-raised: #1E293B;
            --am-slate-600: #475569;
            --am-slate-500: #64748B;
            --am-slate-300: #CBD5E1;
            --am-slate-200: #E2E8F0;
            --am-slate-100: #F1F5F9;
            --am-white: #FFFFFF;
            --am-danger: #B91C1C;
            --am-danger-soft: #FEF2F2;
            --am-radius: 12px;
            --am-shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.18);
            --am-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* Form controls don't inherit the page font by default */
        button, input, select, textarea {
            font-family: inherit;
        }

        ::placeholder {
            color: var(--am-slate-500);
            opacity: 1;
        }

        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: var(--am-font);
            color: var(--am-ink);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* Double-tap anywhere starts voice commands; disable the browser's double-tap zoom */
            touch-action: manipulation;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .leaflet-container {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            background-color: #F1F5F9 !important;
        }

        /* Modern Leaflet popup styles */
        .leaflet-popup-content-wrapper {
            border-radius: 14px !important;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15) !important;
            padding: 6px !important;
        }

        .leaflet-popup-tip {
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15) !important;
        }

        /* Map attribution (required by the OpenStreetMap license): kept, but quiet */
        .leaflet-control-attribution {
            font-size: 10px !important;
            background: rgba(255, 255, 255, 0.75) !important;
            color: var(--am-slate-600) !important;
            border-radius: 6px 0 0 0;
        }

        /* Location blocked banner (App.jsx) */
        .am-gps-banner {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 64px);
            left: 12px;
            right: 12px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 12px 14px;
            min-height: 44px;
            text-align: left;
            background: var(--am-white);
            color: var(--am-ink);
            border: 1px solid var(--am-slate-200);
            border-left: 4px solid var(--am-danger);
            border-radius: var(--am-radius);
            box-shadow: var(--am-shadow-lg);
            cursor: pointer;
        }
        .am-gps-banner__title {
            font-size: 14px;
            font-weight: 700;
            color: var(--am-danger);
        }
        .am-gps-banner__text {
            font-size: 13px;
            line-height: 1.4;
            color: var(--am-slate-600);
        }

        /* High-contrast focus outline for accessibility */
        button:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 3px solid #1D4ED8 !important;
            outline-offset: 2px !important;
        }

        /* Pulsing & radar animations for real-time client marker */
        @keyframes userLocationPulse {
            0% {
                transform: scale(0.85);
                opacity: 0.9;
            }
            70% {
                transform: scale(2.4);
                opacity: 0;
            }
            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }

        @keyframes radarSweep {
            0% {
                opacity: 0.55;
            }
            50% {
                opacity: 0.85;
            }
            100% {
                opacity: 0.55;
            }
        }

        .user-marker-container {
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .realtime-puck-container {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .realtime-pulse-ring {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(29, 78, 216, 0.35);
            animation: userLocationPulse 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
            pointer-events: none;
        }

        .realtime-radar-cone {
            position: absolute;
            top: -16px;
            left: 2px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 50% 100%, rgba(29, 78, 216, 0.45) 0%, rgba(29, 78, 216, 0.12) 65%, transparent 80%);
            clip-path: polygon(50% 100%, 15% 0%, 85% 0%);
            transform-origin: 50% 100%;
            pointer-events: none;
            animation: radarSweep 2s ease-in-out infinite;
        }

        .realtime-puck-core {
            position: relative;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1D4ED8 0%, #1D4ED8 100%);
            border: 2.5px solid #FFFFFF;
            box-shadow: 0 4px 14px rgba(29, 78, 216, 0.5), 0 2px 6px rgba(15, 23, 42, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #FFFFFF;
            z-index: 2;
        }

        .realtime-heading-arrow {
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 5.5px solid transparent;
            border-right: 5.5px solid transparent;
            border-bottom: 9px solid #1D4ED8;
            filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.3));
            z-index: 3;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
