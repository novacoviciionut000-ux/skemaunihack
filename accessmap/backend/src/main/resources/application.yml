supabase:
  url: "https://***REMOVED***.supabase.co"
  key: "***REMOVED***"

spring:
  datasource:
    # 6543 = Supabase transaction pooler (5432 session pooler e limitat la 15 clienti in total)
    url: "jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres?prepareThreshold=0"
    username: "postgres.***REMOVED***"
    password: "***REMOVED***"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect