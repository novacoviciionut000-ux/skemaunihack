# Secrets come from environment variables or a local, git-ignored .env file
# (accessmap/.env or the repository root). See .env.example.
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    # 6543 = Supabase transaction pooler (5432 session pooler e limitat la 15 clienti in total)
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # Secret de cel puțin 256 de biți (32+ caractere) pentru HMAC-SHA256.
  # Dacă lipsește, se generează unul aleator la pornire (token-urile expiră la restart).
  secret: "${JWT_SECRET:}"
  # Valabilitate token: 24 de ore (în milisecunde)
  expiration-ms: 86400000

auth:
  rate-limit:
    max-attempts: 5
    lockout-duration-minutes: 15
  oauth:
    google:
      client-id: "${GOOGLE_CLIENT_ID:mock-google-client-id}"
    facebook:
      app-id: "${FACEBOOK_APP_ID:mock-facebook-app-id}"

mail:
  enabled: ${MAIL_ENABLED:true}
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:noreply.accessmap@gmail.com}

google:
  maps:
    api-key: "${GOOGLE_MAPS_API_KEY:}"

app:
  # Public address of the app (your domain), used for CORS. Defaults to the fixed tunnel URL.
  public-origins: "${APP_PUBLIC_URL:${CLOUDFLARE_TUNNEL_URL:}}"
