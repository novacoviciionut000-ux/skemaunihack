supabase:
  url: "https://***REMOVED***.supabase.co"
  key: "***REMOVED***"

spring:
  datasource:
    # 6543 = Supabase transaction pooler (5432 session pooler e limitat la 15 clienti in total)
    url: "jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres?prepareThreshold=0"
    username: "postgres.***REMOVED***"
    password: "***REMOVED***"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # Secret de cel puțin 256 de biți pentru semnătura HMAC-SHA256
  secret: "***REMOVED***"
  # Valabilitate token: 24 de ore (în milisecunde)
  expiration-ms: 86400000

auth:
  rate-limit:
    max-attempts: 5
    lockout-duration-minutes: 15
  oauth:
    google:
      client-id: "${GOOGLE_CLIENT_ID:mock-google-client-id}"
    facebook:
      app-id: "${FACEBOOK_APP_ID:mock-facebook-app-id}"

mail:
  enabled: ${MAIL_ENABLED:true}
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:noreply.accessmap@gmail.com}

google:
  maps:
    api-key: ***REMOVED***